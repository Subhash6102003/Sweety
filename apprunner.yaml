version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - cd client && npm ci && npm run build
      - cd ../server && npm ci --production
run:
  runtime-version: 20
  command: cd server && node src/server.js
  network:
    port: 5000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "5000"
    - name: SUPABASE_URL
      value: "https://mrcundazfshhgyxainld.supabase.co"
    - name: SUPABASE_ANON_KEY
      value: "YOUR_SUPABASE_ANON_KEY"
    - name: SUPABASE_SECRET_KEY
      value: "YOUR_SUPABASE_SECRET_KEY"
    - name: JWT_SECRET
      value: "YOUR_JWT_SECRET"
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
